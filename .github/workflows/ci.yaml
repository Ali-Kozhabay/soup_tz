name: verify
on: [push, pull_request]

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soup
          POSTGRES_PASSWORD: soup
          POSTGRES_DB: soup_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soup -d soup_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      SOUP_TEST_DATABASE_URL: postgresql+asyncpg://soup:soup@localhost:5432/soup_test
      SOUP_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing
      - run: docker compose config --quiet

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8000/health/ready
      - run: docker compose --profile tools run --rm test
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-log
          path: compose.log
      - if: always()
        run: docker compose down
